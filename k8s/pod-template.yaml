# Kubernetes Pod Template for agent-runner
#
# This template defines the Pod specification for running agent-runner containers
# in Kubernetes Jobs. It includes all required environment variables, resource limits,
# and configuration for both initial runs and retries with S3 session persistence.
#
# Usage:
#   1. Reference template: Use this as a reference when understanding the Pod structure
#   2. Manual deployment: Replace placeholders and apply with kubectl
#   3. Integration: Matches the structure generated by internal/clients/kubernetes.go:BuildJobSpec
#
# Related Tasks:
#   - T059_S3: RETRY_COUNT environment variable
#   - T060_S3: S3 environment variables (session persistence)
#   - T061_S3: Integration with internal/clients/kubernetes.go
#
# Prerequisites:
#   - ServiceAccount 'agent-automation' must exist (see k8s/rbac.yaml)
#   - Secrets must be created for sensitive values (see below)
#   - agent-runner Docker image must be built and pushed to registry
#
# Required Secrets (create before applying):
#   kubectl create secret generic operator-secrets --from-literal=github-app-id=<GITHUB_APP_ID> --from-file=github-private-key=./github-app.pem --from-literal=operator-api-token=<OPERATOR_API_TOKEN>
#   kubectl create secret generic agent-runner-secret --from-literal=token=<OPERATOR_API_TOKEN>
#   kubectl create secret generic anthropic-api-key --from-literal=api-key=<ANTHROPIC_API_KEY>
#   kubectl create secret generic cursor-api-key --from-literal=api-key=<CURSOR_API_KEY>
#   kubectl create secret generic s3-credentials --from-literal=access-key-id=<S3_ACCESS_KEY_ID> --from-literal=secret-access-key=<S3_SECRET_ACCESS_KEY>
#
# Placeholders to replace:
#   - <agent-run-id>: AgentRun database record ID (integer)
#   - <issue-id>: GitHub Issue ID (integer)
#   - <agent-runner-image>: Container image tag (e.g., ghcr.io/owner/agentic-automation-runner:latest or ghcr.io/owner/agentic-automation-runner:sha-abc1234)
#   - <operator-service-name>: Operator service name (e.g., agent-operator)
#   - <operator-service-port>: Operator service port (e.g., 3000)
#   - <repo>: Repository in format owner/name (e.g., octocat/Hello-World)
#   - <prompt>: Issue context prompt (string)
#   - <retry-count>: Current retry count, 0 for initial run (integer)
#   - <s3-endpoint>: S3 endpoint URL (e.g., http://minio:9000 or https://s3.amazonaws.com)
#   - <s3-region>: S3 region (e.g., us-east-1)
#   - <s3-bucket>: S3 bucket name (e.g., agent-sessions)
#   - <image-pull-secret>: ImagePullSecret name(s) for private registry authentication (e.g., ghcr-secret or ghcr-secret,registry-secret for multiple secrets)
#
---
# Version 1: Complete Job Definition
# This is a full Job definition that can be directly applied with kubectl
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-runner-<agent-run-id>
  namespace: default
  labels:
    app: agent-runner
    component: agent-runner
    agent-run-id: "<agent-run-id>"
    issue-id: "<issue-id>"
spec:
  # Job-level configuration
  completions: 1
  parallelism: 1
  backoffLimit: 0  # No retries at Job level (handled by Operator)
  
  # Optional: Set timeout if needed (in seconds)
  # activeDeadlineSeconds: 3600  # 1 hour timeout example
  
  template:
    metadata:
      labels:
        app: agent-runner
        agent-run-id: "<agent-run-id>"
        issue-id: "<issue-id>"
    spec:
      # ServiceAccount from k8s/rbac.yaml
      serviceAccountName: agent-automation
      
      # ImagePullSecrets for private registry authentication (optional)
      # Configure via KUBERNETES_IMAGE_PULL_SECRET environment variable in Operator
      # Supports comma-separated list: "ghcr-secret,registry-secret"
      # imagePullSecrets:
      #   - name: <image-pull-secret>
      
      # Never restart - Job completes once
      restartPolicy: Never
      
      containers:
      - name: agent-runner
        image: <agent-runner-image>
        imagePullPolicy: IfNotPresent
        
        # Command and arguments
        command: ["agent-runner"]
        args:
          - --issue-id=<issue-id>
          - --repo=<repo>
          - --prompt=<prompt>
          # Optional arguments (uncomment if needed):
          # - --previous-attempts=<previous-attempts-json>
          # - --ci-logs=<ci-logs-string>
        
        # Environment variables
        env:
          # Operator API configuration (auto-constructed from Kubernetes service info)
          # The agent-runner constructs the URL as:
          # http://{OPERATOR_SERVICE_NAME}.{KUBERNETES_NAMESPACE}.svc.cluster.local:{OPERATOR_SERVICE_PORT}
          - name: KUBERNETES_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OPERATOR_SERVICE_NAME
            value: "<operator-service-name>"  # e.g., "agent-operator"
          - name: OPERATOR_SERVICE_PORT
            value: "<operator-service-port>"  # e.g., "3000"
          - name: OPERATOR_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: agent-runner-secret
                key: token
          
          # Agent execution configuration
          - name: AGENT_RUN_ID
            value: "<agent-run-id>"
          - name: AGENT_TYPE
            value: "claude-code"  # or "cursor-agent"
          - name: WORKSPACE_DIR
            value: "/workspace"
          
          # GitHub App authentication (required for git operations)
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: operator-secrets
                key: github-app-id
          - name: GITHUB_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: operator-secrets
                key: github-private-key
          
          # Agent-specific API keys (conditional - uncomment based on AGENT_TYPE)
          # For claude-code:
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: anthropic-api-key
                key: api-key
          # For cursor-agent (use instead of ANTHROPIC_API_KEY):
          # - name: CURSOR_API_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: cursor-api-key
          #       key: api-key
          
          # Retry configuration (T059_S3)
          - name: RETRY_COUNT
            value: "<retry-count>"  # "0" for initial run, "1", "2", etc. for retries
          
          # S3 Session Persistence configuration (T060_S3)
          - name: S3_ENDPOINT
            value: "<s3-endpoint>"
          - name: S3_REGION
            value: "<s3-region>"
          - name: S3_BUCKET
            value: "<s3-bucket>"
          - name: S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access-key-id
          - name: S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret-access-key
          - name: S3_USE_PATH_STYLE
            value: "true"  # "true" for MinIO, "false" for AWS S3
          - name: S3_MAX_RETRIES
            value: "5"  # Optional, default is 5
        
        # Resource requirements
        # Note: Memory limit increased from 2Gi to 4Gi to handle memory-intensive tasks
        # like vitest which can consume significant memory during test execution and report generation
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        
        # Working directory (matches WORKSPACE_DIR env var)
        workingDir: /workspace
        
        # Optional: Volume mounts for persistent storage if needed
        # volumeMounts:
        #   - name: workspace
        #     mountPath: /workspace
      
      # Optional: Volumes for persistent storage
      # volumes:
      #   - name: workspace
      #     emptyDir: {}
---
# Version 2: Pod Template Only
#
# This is the Pod template portion extracted for use in:
#   - Go code (internal/clients/kubernetes.go:BuildJobSpec)
#   - kubectl create job --from=...
#   - Manual Pod creation for testing
#
# The full Job structure wraps this template in:
#   apiVersion: batch/v1
#   kind: Job
#   spec:
#     template:
#       <this PodTemplateSpec>
#
apiVersion: v1
kind: Pod
metadata:
  name: agent-runner-<agent-run-id>
  namespace: default
  labels:
    app: agent-runner
    agent-run-id: "<agent-run-id>"
    issue-id: "<issue-id>"
spec:
  serviceAccountName: agent-automation
  # ImagePullSecrets for private registry authentication (optional)
  # Configure via KUBERNETES_IMAGE_PULL_SECRET environment variable in Operator
  # Supports comma-separated list: "ghcr-secret,registry-secret"
  # imagePullSecrets:
  #   - name: <image-pull-secret>
  restartPolicy: Never
  
  containers:
  - name: agent-runner
    image: <agent-runner-image>
    imagePullPolicy: IfNotPresent
    command: ["agent-runner"]
    args:
      - --issue-id=<issue-id>
      - --repo=<repo>
      - --prompt=<prompt>
    env:
      # [Same environment variables as Version 1]
      # See Version 1 above (lines 93-165) for complete env list:
      # - KUBERNETES_NAMESPACE (from Downward API), OPERATOR_SERVICE_NAME, OPERATOR_SERVICE_PORT (Operator API URL construction)
      # - OPERATOR_API_TOKEN (Operator API authentication)
      # - AGENT_RUN_ID, AGENT_TYPE, WORKSPACE_DIR (Agent execution configuration)
      # - GITHUB_APP_ID, GITHUB_PRIVATE_KEY (GitHub App authentication, from operator-secrets)
      # - ANTHROPIC_API_KEY or CURSOR_API_KEY (Agent-specific API keys)
      # - RETRY_COUNT (T059_S3: Retry configuration, "0" for initial run, "1", "2", etc. for retries)
      # - S3_ENDPOINT, S3_REGION, S3_BUCKET (T060_S3: S3 Session Persistence configuration)
      # - S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (from s3-credentials Secret)
      # - S3_USE_PATH_STYLE, S3_MAX_RETRIES (S3 Session Persistence configuration)
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    workingDir: /workspace

