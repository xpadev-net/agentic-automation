openapi: 3.0.0
info:
  title: GitHub Agent Automation API
  version: '0.1'
  description: >
    コメント起動, PR作成, Codexレビュー, 通知関連の主要API自動連携用契約（スケッチ）。
servers:
  - url: http://localhost:8080
paths:
  /agent/run:
    post:
      summary: 'コメントトリガーによるエージェント実行開始'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                issue_id: { type: integer }
                comment: { type: string }
      responses:
        '202': { description: Accept/処理キュー入り }

  /agent/pull-request:
    post:
      summary: 'AIエージェントによるPR自動作成'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_run_id: { type: integer }
      responses:
        '201': { description: PR作成&リンク返却 }

  /agent/review/codex:
    post:
      summary: 'PRに対するCodexレビュー依頼'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pr_id: { type: integer }
      responses:
        '201': { description: レビュー依頼OK }

  /agent/notify/discord:
    post:
      summary: '失敗・折返し通知をDiscord Webhookへ'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
      responses:
        '200': { description: 通知済 }
