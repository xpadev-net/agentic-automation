version: "1.0"

hooks:
  pre: []
  post: []

validation:
  - name: "deps"
    command: "go mod download && go mod tidy"
    description: "Download and tidy Go module dependencies"
    timeout: "3m"
    required: true
  - name: "fmt"
    command: "gofmt -s -w ."
    description: "Check Go code formatting"
    timeout: "1m"
    required: true
  - name: "test"
    command: "go test ./... -v"
    description: "Run all tests"
    timeout: "10m"
    required: true
  - name: "build"
    command: "go build ./..."
    description: "Compile all packages"
    timeout: "5m"
    required: true
