name: Docker Build and Push Base Image

# ベースイメージ（ランタイム環境）のビルドとプッシュ
# workflow_dispatchでのみ実行される（手動トリガー）

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-base
  cancel-in-progress: true

jobs:
  build-and-push-base:
    name: Build and Push Base Image
    runs-on: arc-runners-agentic-automation
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes

      - name: Set owner and image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_NAME="agentic-automation-runner-base"
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "OWNER=$OWNER" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "BUILT_AT=$BUILT_AT" >> $GITHUB_OUTPUT
          echo "tags=ghcr.io/$OWNER/$IMAGE_NAME:latest,ghcr.io/$OWNER/$IMAGE_NAME:sha-$SHORT_SHA,harbor-osk-k8s-pve.xpa.dev/$OWNER/$IMAGE_NAME:latest,harbor-osk-k8s-pve.xpa.dev/$OWNER/$IMAGE_NAME:sha-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.meta.outputs.OWNER }}
          password: ${{ github.token }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor-osk-k8s-pve.xpa.dev
          username: ${{ steps.meta.outputs.OWNER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: ./agent-runner
          file: ./agent-runner/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILT_AT=${{ steps.meta.outputs.BUILT_AT }}
          # cache-from: type=gha,scope=runner-base
          # cache-to: type=gha,mode=max,scope=runner-base

