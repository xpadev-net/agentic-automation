name: Docker Build and Push

# Docker イメージのビルドとプッシュ
# masterブランチへのpush時に、operator と runner の両方のイメージを並列ビルド

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-images:
    name: Build and Push ${{ matrix.component.name }}
    runs-on: arc-runners-agentic-automation
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component:
          - name: runner
            context: ./agent-runner
            dockerfile: ./agent-runner/Dockerfile
            image: agentic-automation-runner
          - name: operator
            context: .
            dockerfile: ./Dockerfile
            image: agentic-automation-operator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes

      - name: Set owner and image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_NAME="${{ matrix.component.image }}"
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "OWNER=$OWNER" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "BUILT_AT=$BUILT_AT" >> $GITHUB_OUTPUT
          echo "tags=ghcr.io/$OWNER/$IMAGE_NAME:latest,ghcr.io/$OWNER/$IMAGE_NAME:sha-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.meta.outputs.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.BUILT_AT }}
          # cache-from: type=gha,scope=${{ matrix.component.name }}
          # cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
