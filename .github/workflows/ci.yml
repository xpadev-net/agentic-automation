name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['**']

# Use minimal default permissions for all jobs
permissions:
  contents: read

jobs:
  # 依存関係チェック
  deps:
    name: Dependencies Check
    runs-on: arc-runners-agentic-automation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false

      - name: Cache Go modules (MinIO)
        uses: tespkg/actions-cache@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.MINIO_REGION }}
        with:
          endpoint: ${{ secrets.MINIO_ENDPOINT }}
          port: ${{ secrets.MINIO_PORT }}
          bucket: ${{ secrets.MINIO_BUCKET }}
          use-fallback: false
          insecure: true
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          path: |
            ~/go/pkg/mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum are not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

  deps-agent-runner:
    name: Dependencies Check (agent-runner)
    runs-on: arc-runners-agentic-automation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false

      - name: Cache Go modules (MinIO)
        uses: tespkg/actions-cache@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.MINIO_REGION }}
        with:
          endpoint: ${{ secrets.MINIO_ENDPOINT }}
          port: ${{ secrets.MINIO_PORT }}
          bucket: ${{ secrets.MINIO_BUCKET }}
          use-fallback: false
          insecure: true
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          path: |
            ~/go/pkg/mod

      - name: Download dependencies (agent-runner)
        working-directory: agent-runner
        run: go mod download

      - name: Verify dependencies (agent-runner)
        working-directory: agent-runner
        run: go mod verify

      - name: Check go.mod and go.sum are tidy (agent-runner)
        working-directory: agent-runner
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "agent-runner: go.mod or go.sum are not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

  # フォーマットチェック
  fmt:
    name: Format Check
    runs-on: arc-runners-agentic-automation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -d . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w .' to format."
            gofmt -s -d .
            exit 1
          fi

  # リント
  vet:
    name: Lint
    runs-on: arc-runners-agentic-automation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false

      - name: Cache Go modules (MinIO)
        uses: tespkg/actions-cache@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.MINIO_REGION }}
        with:
          endpoint: ${{ secrets.MINIO_ENDPOINT }}
          port: ${{ secrets.MINIO_PORT }}
          bucket: ${{ secrets.MINIO_BUCKET }}
          use-fallback: false
          insecure: true
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          path: |
            ~/go/pkg/mod

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

  # テスト実行
  test:
    name: Test
    runs-on: arc-runners-agentic-automation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false

      - name: Cache Go modules (MinIO)
        uses: tespkg/actions-cache@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.MINIO_REGION }}
        with:
          endpoint: ${{ secrets.MINIO_ENDPOINT }}
          port: ${{ secrets.MINIO_PORT }}
          bucket: ${{ secrets.MINIO_BUCKET }}
          use-fallback: false
          insecure: true
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          path: |
            ~/go/pkg/mod

      - name: Install build dependencies (for CGO)
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gcc libc6-dev
          elif command -v yum &> /dev/null; then
            sudo yum install -y gcc glibc-devel
          elif command -v brew &> /dev/null; then
            # macOS - Xcode command line tools usually provide gcc
            xcode-select --install 2>/dev/null || true
          fi

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test ./... -v

  # ビルド検証
  build:
    name: Build
    runs-on: arc-runners-agentic-automation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false
  
      - name: Cache Go modules (MinIO)
        uses: tespkg/actions-cache@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.MINIO_REGION }}
        with:
          endpoint: ${{ secrets.MINIO_ENDPOINT }}
          port: ${{ secrets.MINIO_PORT }}
          bucket: ${{ secrets.MINIO_BUCKET }}
          use-fallback: false
          insecure: true
          key: go-modules-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          path: |
            ~/go/pkg/mod

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          mkdir -p bin
          if find ./cmd/operator -name "*.go" -type f 2>/dev/null | grep -q .; then
            go build -o bin/operator ./cmd/operator
          fi
          if find ./cmd/agent-runner -name "*.go" -type f 2>/dev/null | grep -q .; then
            go build -o bin/agent-runner ./cmd/agent-runner
          fi
