# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "src/*.{js,jsx,ts,tsx,json,css,md}"
      run: pnpm biome check {staged_files} --write --unsafe
      stage_fixed: true
    type-check:
      glob: "src/*.{ts,tsx}"
      run: pnpm type-check

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    type-check:
      run: pnpm type-check
    test:
      run: pnpm test
