pre-commit:
  commands:
    format:
      run: gofmt -s -w {staged_files}
      glob: "*.go"
      stage_fixed: true
    deps-check:
      run: |
        set -e
        for MODDIR in . agent-runner; do
          if [ -f "$MODDIR/go.mod" ]; then
            (cd "$MODDIR" && go mod verify && go mod tidy)
            if ! git diff --exit-code "$MODDIR/go.mod" "$MODDIR/go.sum" 2>/dev/null; then
              echo "$MODDIR/go.mod or $MODDIR/go.sum are not tidy. Run 'go mod tidy' and commit the changes."
              exit 1
            fi
          fi
        done
      glob: "{go.mod,agent-runner/go.mod}"

pre-push:
  commands:
    format:
      run: gofmt -s -w {staged_files}
      glob: "*.go"
      stage_fixed: true
    deps-check:
      run: |
        set -e
        for MODDIR in . agent-runner; do
          if [ -f "$MODDIR/go.mod" ]; then
            (cd "$MODDIR" && go mod verify && go mod tidy)
            if ! git diff --exit-code "$MODDIR/go.mod" "$MODDIR/go.sum" 2>/dev/null; then
              echo "$MODDIR/go.mod or $MODDIR/go.sum are not tidy. Run 'go mod tidy' and commit the changes."
              exit 1
            fi
          fi
        done
      glob: "{go.mod,agent-runner/go.mod}"
    test:
      run: go test ./... -v
    build:
      run: |
        mkdir -p bin
        if find ./cmd/operator -name "*.go" -type f 2>/dev/null | grep -q .; then
          go build -o bin/operator ./cmd/operator
        fi
        if find ./cmd/agent-runner -name "*.go" -type f 2>/dev/null | grep -q .; then
          go build -o bin/agent-runner ./cmd/agent-runner
        fi

